<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  <rect width="800" height="450" fill="url(#grid6)"/>

  <!-- Top Metadata Header -->
  <rect x="40" y="36" width="240" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="56" cy="51" r="4" fill="#06b6d4"/>
  <text x="70" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CORE WEB VITALS &amp; RUNTIME</text>

  <!-- Lighthouse Score Dashboard Metric -->
  <g transform="translate(140, 140)">
    <circle cx="80" cy="80" r="65" stroke="#1e293b" stroke-width="10"/>
    <circle cx="80" cy="80" r="65" stroke="#10b981" stroke-width="10" stroke-dasharray="408" stroke-dashoffset="12" stroke-linecap="round"/>
    <text x="80" y="85" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="34" font-weight="800">100</text>
    <text x="80" y="105" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="600">PERFORMANCE</text>
  </g>

  <!-- Key Vital Indicators -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="300" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="26" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">LCP (Largest Contentful Paint)</text>
    <text x="250" y="26" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">0.8s</text>

    <rect x="0" y="56" width="300" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="82" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">INP (Interaction to Next Paint)</text>
    <text x="250" y="82" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">18ms</text>

    <rect x="0" y="112" width="300" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="16" y="138" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">CLS (Cumulative Layout Shift)</text>
    <text x="250" y="138" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">0.00</text>
  </g>

  <!-- Bottom Metric -->
  <text x="40" y="415" fill="#64748b" font-family="monospace" font-size="12">TURBOPACK COMPILED · EDGE CDN CACHING · ZERO UNNECESSARY RUNTIME DEPENDENCIES</text>
</svg>
