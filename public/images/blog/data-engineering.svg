<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  <rect width="800" height="450" fill="url(#grid5)"/>

  <!-- Top Metadata Header -->
  <rect x="40" y="36" width="230" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="56" cy="51" r="4" fill="#a855f7"/>
  <text x="70" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STREAMING DATA ARCHITECTURE</text>

  <!-- Flow pipeline visualization -->
  <g transform="translate(60, 160)">
    <!-- Stage 1: Ingestion -->
    <rect x="0" y="0" width="160" height="130" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="30" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="700">INGESTION</text>
    <text x="20" y="55" fill="#94a3b8" font-family="monospace" font-size="9">Apache Kafka</text>
    <text x="20" y="75" fill="#94a3b8" font-family="monospace" font-size="9">CDC Debezium</text>
    <text x="20" y="95" fill="#94a3b8" font-family="monospace" font-size="9">REST Webhooks</text>
    <circle cx="140" cy="65" r="4" fill="#a855f7"/>

    <!-- Arrow 1 -->
    <path d="M 160 65 L 230 65" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="230,60 240,65 230,70" fill="#a855f7"/>

    <!-- Stage 2: Processing & Enrichment -->
    <rect x="250" y="0" width="180" height="130" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="270" y="30" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="700">TRANSFORMATION</text>
    <text x="270" y="55" fill="#94a3b8" font-family="monospace" font-size="9">PySpark / Flink</text>
    <text x="270" y="75" fill="#94a3b8" font-family="monospace" font-size="9">FastEmbed Vectors</text>
    <text x="270" y="95" fill="#94a3b8" font-family="monospace" font-size="9">Data Scrubbing</text>

    <!-- Arrow 2 -->
    <path d="M 430 65 L 500 65" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="500,60 510,65 500,70" fill="#6366f1"/>

    <!-- Stage 3: Analytics Lakehouse -->
    <rect x="520" y="0" width="160" height="130" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="540" y="30" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="700">ANALYTICS / LAKE</text>
    <text x="540" y="55" fill="#94a3b8" font-family="monospace" font-size="9">PostgreSQL OLAP</text>
    <text x="540" y="75" fill="#94a3b8" font-family="monospace" font-size="9">Qdrant Vector DB</text>
    <text x="540" y="95" fill="#94a3b8" font-family="monospace" font-size="9">ClickHouse</text>
  </g>

  <!-- Bottom Metric -->
  <text x="40" y="415" fill="#64748b" font-family="monospace" font-size="12">HIGH-THROUGHPUT · REAL-TIME VECTOR EMBEDDINGS · ACID GUARANTEES</text>
</svg>
