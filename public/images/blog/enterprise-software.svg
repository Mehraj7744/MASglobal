<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>
  <rect width="800" height="450" fill="url(#grid3)"/>

  <!-- Top Metadata Header -->
  <rect x="40" y="36" width="220" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="56" cy="51" r="4" fill="#6366f1"/>
  <text x="70" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ENTERPRISE SOFTWARE CORE</text>

  <!-- Software Blueprint Diagram -->
  <!-- Top: Client Layer -->
  <rect x="220" y="110" width="360" height="48" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="300" y="140" fill="#e0e7ff" font-family="monospace" font-size="12" font-weight="700">FRONTEND // NEXT.JS + TAILWIND</text>

  <!-- Downward connector -->
  <line x1="400" y1="158" x2="400" y2="195" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Mid: API Gateway & Service Layer -->
  <rect x="140" y="195" width="520" height="95" rx="10" fill="#0b1329" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="160" y="210" width="140" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="175" y="235" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="700">AUTH &amp; RBAC</text>
  <text x="175" y="255" fill="#64748b" font-family="monospace" font-size="9">JWT · OAUTH2 · MFA</text>

  <rect x="330" y="210" width="140" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="345" y="235" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="700">BUSINESS LOGIC</text>
  <text x="345" y="255" fill="#64748b" font-family="monospace" font-size="9">SPRING BOOT · FASTAPI</text>

  <rect x="500" y="210" width="140" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="515" y="235" fill="#fde047" font-family="monospace" font-size="10" font-weight="700">EVENT PIPELINE</text>
  <text x="515" y="255" fill="#64748b" font-family="monospace" font-size="9">KAFKA · RABBITMQ</text>

  <!-- Downward connector -->
  <line x1="400" y1="290" x2="400" y2="325" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Bottom: Data Storage Layer -->
  <rect x="220" y="325" width="360" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="260" y="355" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="700">PERSISTENCE // POSTGRESQL + REDIS</text>

  <!-- Bottom Metric -->
  <text x="40" y="415" fill="#64748b" font-family="monospace" font-size="12">STRICT TYPE INTEGRITY · CI/CD PIPELINE · ZERO RUNTIME EXCEPTIONS</text>
</svg>
