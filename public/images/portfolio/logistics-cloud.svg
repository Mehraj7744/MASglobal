<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logisticsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#logisticsBg)"/>
  <circle cx="400" cy="250" r="150" fill="#f59e0b" opacity="0.08"/>
  <g transform="translate(100, 80)">
    <rect width="600" height="340" rx="16" fill="#090d16" stroke="#27272a" stroke-width="1.5"/>
    <rect width="600" height="45" rx="16" fill="#18181b"/>
    <rect y="35" width="600" height="10" fill="#18181b"/>
    <text x="30" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GLOBAL FLEET & SUPPLY CHAIN ORCHESTRATION</text>
    <text x="470" y="28" fill="#a1a1aa" font-family="monospace" font-size="11">ACTIVE HUBS: 48</text>
    
    <!-- Geo Routing Graph -->
    <circle cx="120" cy="220" r="8" fill="#f59e0b"/>
    <circle cx="280" cy="180" r="10" fill="#38bdf8"/>
    <circle cx="420" cy="240" r="12" fill="#818cf8"/>
    <circle cx="530" cy="170" r="9" fill="#10b981"/>
    <line x1="120" y1="220" x2="280" y2="180" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
    <line x1="280" y1="180" x2="420" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="420" y1="240" x2="530" y2="170" stroke="#818cf8" stroke-width="2.5"/>
    
    <g transform="translate(60, 70)">
      <text x="0" y="16" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="11" text-transform="uppercase">Shipment Turnaround</text>
      <text x="0" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">-38% Lead Time</text>
      <text x="0" y="64" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Predictive Routing AI</text>
    </g>
    <g transform="translate(320, 70)">
      <text x="0" y="16" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="11" text-transform="uppercase">Sensor Telemetry</text>
      <text x="0" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">1.8M Events/Sec</text>
      <text x="0" y="64" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Kafka Stream Engine</text>
    </g>
  </g>
</svg>
