<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#heroBg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Radial Glow Halos -->
  <circle cx="780" cy="300" r="280" fill="#4f46e5" opacity="0.18" filter="url(#glow)"/>
  <circle cx="920" cy="420" r="220" fill="#0284c7" opacity="0.14" filter="url(#glow)"/>

  <!-- Perspective Floor Grid Rays -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="600" y1="500" x2="1200" y2="675"/>
    <line x1="600" y1="500" x2="950" y2="675"/>
    <line x1="600" y1="500" x2="750" y2="675"/>
    <line x1="600" y1="500" x2="550" y2="675"/>
    <line x1="600" y1="500" x2="350" y2="675"/>
  </g>

  <!-- Neural Network Cluster Topology -->
  <!-- Conduits & Data Bridges -->
  <g stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,4">
    <line x1="680" y1="180" x2="820" y2="140"/>
    <line x1="820" y1="140" x2="980" y2="200"/>
    <line x1="680" y1="180" x2="740" y2="290"/>
    <line x1="820" y1="140" x2="860" y2="270"/>
    <line x1="980" y1="200" x2="1040" y2="320"/>
    <line x1="740" y1="290" x2="880" y2="340"/>
    <line x1="860" y1="270" x2="880" y2="340"/>
    <line x1="1040" y1="320" x2="960" y2="430"/>
    <line x1="880" y1="340" x2="960" y2="430"/>
    <line x1="740" y1="290" x2="760" y2="460"/>
    <line x1="880" y1="340" x2="760" y2="460"/>
    <line x1="760" y1="460" x2="960" y2="430"/>
  </g>

  <!-- Central Cloud & System Architecture Nodes -->
  <!-- Node: Gateway -->
  <g transform="translate(680, 180)">
    <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle r="8" fill="#38bdf8"/>
    <text x="32" y="5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API Gateway</text>
  </g>

  <!-- Node: LLM Orchestrator -->
  <g transform="translate(820, 140)">
    <circle r="26" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)"/>
    <circle r="12" fill="url(#neonIndigo)"/>
    <text x="-45" y="-36" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LLM Engine</text>
  </g>

  <!-- Node: Inference Node -->
  <g transform="translate(980, 200)">
    <circle r="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <circle r="7" fill="#38bdf8"/>
    <text x="30" y="5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Model Inference</text>
  </g>

  <!-- Central Core: Enterprise Data Matrix -->
  <g transform="translate(880, 340)">
    <!-- Outer Orbit Rings -->
    <circle r="60" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,6"/>
    <circle r="44" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
    <!-- Core Emblem -->
    <rect x="-18" y="-18" width="36" height="36" rx="8" fill="url(#neonBlue)"/>
    <path d="M-8 -4 L0 -12 L8 -4 L0 4 Z M-8 8 L0 0 L8 8 L0 16 Z" fill="#ffffff"/>
    <text x="-65" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">MAS AI Engine</text>
  </g>

  <!-- Node: Realtime Analytics -->
  <g transform="translate(740, 290)">
    <circle r="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <circle r="6" fill="#818cf8"/>
    <text x="-120" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Real-time Pipeline</text>
  </g>

  <!-- Node: Multi-Cloud Cluster -->
  <g transform="translate(1040, 320)">
    <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle r="8" fill="#38bdf8"/>
    <text x="30" y="5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cloud Cluster</text>
  </g>

  <!-- Node: Enterprise Data Lake -->
  <g transform="translate(960, 430)">
    <circle r="24" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle r="9" fill="#a855f7"/>
    <text x="32" y="5" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Secure Store</text>
  </g>

  <!-- Node: Automated Edge -->
  <g transform="translate(760, 460)">
    <circle r="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <circle r="7" fill="#0ea5e9"/>
    <text x="-95" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Edge Delivery</text>
  </g>

  <!-- Floating HUD Glass Panels (Isometric) -->
  <!-- Metric Card 1: System Health -->
  <g transform="translate(100, 160)">
    <rect width="260" height="110" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">System Architecture</text>
    <text x="24" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">99.99% Availability</text>
    <text x="24" y="92" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">High-Throughput Global Edge</text>
  </g>

  <!-- Metric Card 2: AI Pipeline -->
  <g transform="translate(140, 310)">
    <rect width="280" height="120" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Intelligent Automation</text>
    <text x="24" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Enterprise AI Ops</text>
    <text x="24" y="96" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11">Automated Workflows & LLMs</text>
  </g>

  <!-- Metric Card 3: Cloud Engineering -->
  <g transform="translate(100, 470)">
    <rect width="270" height="110" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Engineering Standards</text>
    <text x="24" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Cloud-Native</text>
    <text x="24" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Microservices, Containers & CI/CD</text>
  </g>
</svg>
