<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#webBg)"/>

  <!-- Desktop Display Frame -->
  <g transform="translate(150, 90)">
    <rect width="500" height="320" rx="14" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <!-- Screen Header -->
    <rect width="500" height="32" rx="14" fill="#1e293b"/>
    <rect y="22" width="500" height="10" fill="#1e293b"/>
    <circle cx="20" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="16" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="16" r="4.5" fill="#10b981"/>
    
    <!-- Screen Content: Web App Layout Mockup -->
    <!-- Navbar wireframe -->
    <rect x="20" y="48" width="80" height="12" rx="3" fill="#6366f1"/>
    <rect x="360" y="50" width="30" height="8" rx="2" fill="#475569"/>
    <rect x="400" y="50" width="30" height="8" rx="2" fill="#475569"/>
    <rect x="440" y="46" width="40" height="16" rx="4" fill="#38bdf8"/>

    <!-- Hero Wireframe -->
    <rect x="20" y="80" width="220" height="18" rx="3" fill="#f8fafc"/>
    <rect x="20" y="106" width="180" height="10" rx="2" fill="#64748b"/>
    <rect x="20" y="122" width="140" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="146" width="70" height="20" rx="4" fill="#6366f1"/>

    <!-- Dynamic Hero Chart Area -->
    <rect x="270" y="80" width="210" height="100" rx="8" fill="#111827" stroke="#1e293b"/>
    <path d="M 285 155 Q 330 110 370 135 T 465 100" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 285 165 Q 340 135 390 150 T 465 125" fill="none" stroke="#818cf8" stroke-width="2"/>

    <!-- Bento Grid Section -->
    <rect x="20" y="200" width="145" height="100" rx="8" fill="#111827" stroke="#1e293b"/>
    <rect x="175" y="200" width="145" height="100" rx="8" fill="#111827" stroke="#1e293b"/>
    <rect x="330" y="200" width="150" height="100" rx="8" fill="#111827" stroke="#1e293b"/>

    <!-- Stand base -->
    <rect x="220" y="320" width="60" height="30" fill="#1e293b"/>
    <rect x="180" y="350" width="140" height="8" rx="3" fill="#334155"/>
  </g>

  <!-- Mobile Device Overlap -->
  <g transform="translate(560, 240)">
    <rect width="130" height="250" rx="20" fill="#090d16" stroke="#475569" stroke-width="2.5"/>
    <rect x="40" y="8" width="50" height="8" rx="4" fill="#1e293b"/>
    <!-- Mobile Content Mockup -->
    <rect x="15" y="35" width="100" height="14" rx="3" fill="#6366f1"/>
    <rect x="15" y="60" width="100" height="60" rx="6" fill="#111827" stroke="#1e293b"/>
    <rect x="15" y="130" width="45" height="40" rx="6" fill="#111827" stroke="#1e293b"/>
    <rect x="70" y="130" width="45" height="40" rx="6" fill="#111827" stroke="#1e293b"/>
    <rect x="15" y="180" width="100" height="45" rx="6" fill="#111827" stroke="#1e293b"/>
  </g>

  <!-- Tagline Card -->
  <g transform="translate(120, 480)">
    <rect width="380" height="64" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Web Platforms & Applications</text>
    <text x="24" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Responsive, High-Performance Digital Experiences</text>
  </g>
</svg>
