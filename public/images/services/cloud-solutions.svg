
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cloudBg)"/>

  <!-- Concentric Cluster Rings -->
  <circle cx="400" cy="270" r="200" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="400" cy="270" r="140" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="400" cy="270" r="70" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Core Cloud Server Icon -->
  <g transform="translate(400, 270)">
    <rect x="-24" y="-18" width="48" height="10" rx="3" fill="#0284c7"/>
    <rect x="-24" y="-4" width="48" height="10" rx="3" fill="#0284c7"/>
    <rect x="-24" y="10" width="48" height="10" rx="3" fill="#0284c7"/>
    <circle cx="16" cy="-13" r="1.5" fill="#ffffff"/>
    <circle cx="16" cy="1" r="1.5" fill="#ffffff"/>
    <circle cx="16" cy="15" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Orbital Node 1: Kubernetes -->
  <g transform="translate(260, 210)">
    <circle r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="4" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">K8s</text>
    <text x="0" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Orchestration</text>
  </g>

  <!-- Orbital Node 2: CI/CD -->
  <g transform="translate(540, 210)">
    <circle r="36" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="4" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CI/CD</text>
    <text x="0" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Automation</text>
  </g>

  <!-- Orbital Node 3: Cloud Infrastructure -->
  <g transform="translate(400, 420)">
    <circle r="36" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cloud</text>
    <text x="0" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Infrastructure</text>
  </g>

  <!-- Connecting Radial Rays -->
  <line x1="330" y1="270" x2="295" y2="235" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="470" y1="270" x2="505" y2="235" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="400" y1="340" x2="400" y2="384" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Info Strip -->
  <g transform="translate(160, 500)">
    <rect width="480" height="60" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CLOUD INFRASTRUCTURE &amp; DEVOPS</text>
    <text x="24" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Scalable, Resilient, Automated Cloud Ecosystems</text>
  </g>
</svg>
