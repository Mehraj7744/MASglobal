<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#softBg)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="440" y1="0" x2="440" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="680" y1="0" x2="680" y2="600"/>
  </g>

  <!-- Editor Window Terminal Plate -->
  <g transform="translate(140, 80)">
    <rect width="520" height="380" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="520" height="42" rx="16" fill="#0f172a"/>
    <rect y="30" width="520" height="12" fill="#0f172a"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    <text x="210" y="26" fill="#64748b" font-family="monospace" font-size="12">system-core.service.ts</text>

    <!-- Code Block Visual Representation -->
    <g transform="translate(30, 70)" font-family="monospace" font-size="13">
      <!-- Line numbers -->
      <text x="0" y="20" fill="#475569">01</text>
      <text x="0" y="48" fill="#475569">02</text>
      <text x="0" y="76" fill="#475569">03</text>
      <text x="0" y="104" fill="#475569">04</text>
      <text x="0" y="132" fill="#475569">05</text>
      <text x="0" y="160" fill="#475569">06</text>
      <text x="0" y="188" fill="#475569">07</text>
      <text x="0" y="216" fill="#475569">08</text>

      <!-- Code tokens -->
      <text x="40" y="20" fill="#f43f5e">export class <tspan fill="#38bdf8">EnterpriseEngine</tspan> {</text>
      <text x="60" y="48" fill="#a78bfa">private readonly <tspan fill="#e2e8f0">pipeline: DataPipeline;</tspan></text>
      <text x="60" y="76" fill="#e2e8f0">async executeJob(input: <tspan fill="#38bdf8">JobPayload</tspan>): <tspan fill="#34d399">Promise&lt;Result&gt;</tspan> {</text>
      <text x="80" y="104" fill="#94a3b8">const validated = await this.security.verify(input);</text>
      <text x="80" y="132" fill="#94a3b8">const response = await this.inferenceCluster.process(validated);</text>
      <text x="80" y="160" fill="#38bdf8">return this.cache.commit(response);</text>
      <text x="60" y="188" fill="#e2e8f0">}</text>
      <text x="40" y="216" fill="#f43f5e">}</text>
    </g>
  </g>

  <!-- Overlapping Architecture Diagram Card -->
  <g transform="translate(360, 360)">
    <rect width="320" height="150" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Full-Stack Architecture</text>
    <text x="24" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Custom Software Engineering</text>
    <text x="24" y="94" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Next.js • Spring Boot • Microservices • Postgre</text>
    <rect x="24" y="112" width="120" height="22" rx="4" fill="#1e293b"/>
    <text x="32" y="127" fill="#38bdf8" font-family="monospace" font-size="10">PRODUCTION GRADE</text>
  </g>
</svg>
